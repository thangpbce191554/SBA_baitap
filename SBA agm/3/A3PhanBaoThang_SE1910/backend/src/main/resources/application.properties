server.port=8080

# Cấu hình MS SQL Server (Database: A3PhanBaoThang_SE1910)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A3PhanBaoThang_SE1910;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Cấu hình tài khoản Staff từ application.properties (Đúng yêu cầu đề trang 5)
hotel.staff.email=admin@fuhotel.com
hotel.staff.password=admin123
hotel.staff.name=Staff Administrator

# Cấu hình JWT (JSON Web Token)
jwt.secret=FUMiniHotelManagementSecretKeyForSigningJwtTokens2026SBA301PhanBaoThang
jwt.expiration-ms=86400000

